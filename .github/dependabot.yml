version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      routine-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # torch 只存在於可選的 local-retrieval GPU extra，且必須來自 cu128 index，
      # 該 index 對 cp311 目前最新只到 2.11.0，沒有已修補版本可用。Dependabot 會
      # 反覆嘗試並失敗。setuptools 由 torch 的 metadata 連帶約束，只要 torch 停在
      # 2.11.0 就無法單獨升級。理由與重新評估條件見 .github/SECURITY.md。
      - dependency-name: "torch"
      - dependency-name: "setuptools"
      # Synthetic provenance PDFs and their SHA-256 manifest were generated
      # with 1.28.0. Upgrade only together with an independently reviewed
      # corpus migration; otherwise the byte-reproducibility test must skip.
      - dependency-name: "pymupdf"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
    groups:
      routine-container:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

